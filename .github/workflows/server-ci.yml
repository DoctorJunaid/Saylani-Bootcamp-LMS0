name: Server CI

on:
  pull_request:
    branches: [dev]

jobs:
  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
      - name: Install dependencies
        run: npm ci

      - name: Syntax checking
        run: npm run lint