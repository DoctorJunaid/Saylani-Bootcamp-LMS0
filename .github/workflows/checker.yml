name: Checker CI

on:
  pull_request:
    branches: [dev]

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          
      - name: Install dependencies
        run: npm ci

      - name: Syntax checking
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test  

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          
      - name: Install dependencies
        run: npm ci

      - name: Syntax checking
        run: npm run lint
